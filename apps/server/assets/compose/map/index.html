<!DOCTYPE html><html><head><meta charset="utf-8"><style>
.over{position:absolute;left:0;top:0}
.card{position:absolute;display:flex;flex-direction:column;justify-content:center}
.card .name{font-weight:var(--vg-w-display);letter-spacing:var(--vg-track-display);text-transform:var(--vg-case-display);text-wrap:balance}
.card .sub{font-weight:var(--vg-w-body);letter-spacing:var(--vg-track-display)}
.nb{position:absolute;white-space:nowrap;letter-spacing:var(--vg-track-display);font-weight:var(--vg-w-body)}
</style><script src="gsap.min.js"></script><script src="common.js"></script></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-fps="30">
<script>
// tokens-v1 (TASK-110). Colours, type, motion, spacing and shape come from VG.S.
// Axis: label (plate | float), plus entrance and background. Zoom and highlight stay on the shot.
const VG = window.VGInit();
const { v, W, H, END, portrait, box, tl, at, el, fitText, M, axis, alpha, enter, fallbackStyle } = VG;
const S = fallbackStyle();
const K = S.color, T = S.type, L = S.layout, SP = S.space;
const root = document.getElementById("root");
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => {
  const node = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
  if (parent) parent.appendChild(node);
  return node;
};
const m = Math.min(W, H);
const lang = String(v.language || "vi").slice(0, 2);
const zoom = ["push", "fly", "static"].includes(v.zoom) ? v.zoom : "push";
const highlight = ["fill", "outline", "glow"].includes(v.highlight) ? v.highlight : "fill";

// --- data -----------------------------------------------------------------
const feats = ((v.geo && v.geo.features) || []).filter((f) => f && f.geometry && /^(Multi)?Polygon$/.test(f.geometry.type));
const polysOf = (f) => (f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates);
const prop = (f, key) => (f.properties || {})[key];
const nameOf = (f) => String(prop(f, "name_" + lang) || prop(f, "name") || "");
const focus = feats.find((f) => String(prop(f, "id")) === String(v.focus)) || null;
const pinLL = Array.isArray(v.pin) && v.pin.length === 2 && v.pin.every((n) => Number.isFinite(Number(n))) ? v.pin.map(Number) : null;
const llBox = (list) => {
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  list.forEach((f) => polysOf(f).forEach((poly) => (poly[0] || []).forEach(([lon, lat]) => {
    b[0] = Math.min(b[0], lon); b[1] = Math.min(b[1], lat); b[2] = Math.max(b[2], lon); b[3] = Math.max(b[3], lat);
  })));
  return b;
};
const span = Math.max(0.2, Number(v.spanDeg) || 3);
const endLL = focus ? llBox([focus]) : pinLL ? [pinLL[0] - span, pinLL[1] - span, pinLL[0] + span, pinLL[1] + span] : feats.length ? llBox(feats) : [100, 8, 110, 24];
// Equirectangular, stretched for the latitude of the place: fine for a country or a region.
const lon0 = (endLL[0] + endLL[2]) / 2;
const lat0 = (endLL[1] + endLL[3]) / 2;
const kx = Math.max(0.2, Math.cos((lat0 * Math.PI) / 180));
const proj = ([lon, lat]) => [(lon - lon0) * kx, -(lat - lat0)];
const projBox = (b) => { const a = proj([b[0], b[3]]); const c = proj([b[2], b[1]]); return { x0: a[0], y0: a[1], x1: c[0], y1: c[1] }; };
const grow = (b, f) => { const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, w = (b.x1 - b.x0) * f / 2, h = (b.y1 - b.y0) * f / 2; return { x0: cx - w, y0: cy - h, x1: cx + w, y1: cy + h }; };

// End view: the place, never tighter than minSpanDeg so a city keeps its surroundings.
let endBox = projBox(endLL);
const minSpan = Math.max(0.1, Number(v.minSpanDeg) || 2.5);
{
  const w = Math.max(endBox.x1 - endBox.x0, minSpan * kx), h = Math.max(endBox.y1 - endBox.y0, minSpan);
  const cx = (endBox.x0 + endBox.x1) / 2, cy = (endBox.y0 + endBox.y1) / 2;
  endBox = { x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 };
}
// Start view: a named feature, a [w,s,e,n] box, or the end view widened.
let startBox;
const fromFeat = typeof v.from === "string" ? feats.find((f) => String(prop(f, "id")) === v.from) : null;
if (fromFeat) startBox = grow(projBox(llBox([fromFeat])), 1.15);
else if (Array.isArray(v.from) && v.from.length === 4) startBox = projBox(v.from.map(Number));
else startBox = grow(endBox, Math.max(1.2, Number(v.zoomFrom) || 3.2));

const fit = (b, r) => {
  const s = Math.min(r.w / (b.x1 - b.x0), r.h / (b.y1 - b.y0));
  return { cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, ls: Math.log(s), ax: r.x + r.w / 2, ay: r.y + r.h / 2 };
};
// Plate keeps a reserved zone so the card never covers the place: above the map on 9:16 and for
// wide shapes, beside it for tall shapes on 16:9. Float puts a caption by the pin instead.
// No axis yet: plate, as the old template did.
const labelText = String(v.label || (focus ? nameOf(focus) : "")).trim();
const subText = String(v.sublabel || "").trim();
const shape = (endBox.x1 - endBox.x0) / (endBox.y1 - endBox.y0);
const labelId = axis("label", ["plate", "float"], v.style && v.style.axes ? undefined : "plate");
const floating = labelId === "float";
const cardSide = !labelText || floating ? "none" : portrait || shape > 1.25 ? "top" : "left";
const zoneGap = Math.round(m * 0.03);
const cardZone = cardSide === "top"
  ? { x: box.x, y: box.y, w: box.w, h: Math.round(box.h * (portrait ? 0.2 : 0.27)) }
  : cardSide === "left" ? { x: box.x, y: box.y, w: Math.round(box.w * 0.4), h: box.h } : { x: box.x, y: box.y, w: 0, h: 0 };
const mapRect = cardSide === "top"
  ? { x: box.x, y: box.y + cardZone.h + zoneGap, w: box.w, h: box.h - cardZone.h - zoneGap }
  : cardSide === "left" ? { x: box.x + cardZone.w + zoneGap, y: box.y, w: box.w - cardZone.w - zoneGap, h: box.h } : { x: box.x, y: box.y, w: box.w, h: box.h };
const inset = 0.06;
const endCam = fit(endBox, { x: mapRect.x + mapRect.w * inset, y: mapRect.y + mapRect.h * inset, w: mapRect.w * (1 - 2 * inset), h: mapRect.h * (1 - 2 * inset) });
let startCam = fit(startBox, { x: 0, y: 0, w: W, h: H });
if (startCam.ls > endCam.ls - 0.1) startCam = Object.assign({}, endCam, { ls: endCam.ls - 0.1 });
if (zoom === "fly") { startCam.cx += (startBox.x1 - startBox.x0) * 0.2; startCam.ls -= 0.2; }
if (zoom === "static") startCam = Object.assign({}, endCam, { ls: endCam.ls - Math.log(1.12) });

// --- map ------------------------------------------------------------------
const seaGlow = el("div", "over", root); // a soft light on the sea around the place, set once the pin is known
seaGlow.style.cssText = `width:${W}px;height:${H}px`;
const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: "over" }, root);
const world = svgEl("g", {}, svg);
const cam = Object.assign({}, startCam);
const apply = () => {
  const s = Math.exp(cam.ls);
  world.setAttribute("transform", `translate(${(cam.ax - cam.cx * s).toFixed(2)} ${(cam.ay - cam.cy * s).toFixed(2)}) scale(${s.toFixed(4)})`);
};
apply();
const line = Math.max(2, m * 0.0028);
// Graticule: about eight lines across the widest view.
{
  const wide = { x0: Math.min(startBox.x0, endBox.x0), y0: Math.min(startBox.y0, endBox.y0), x1: Math.max(startBox.x1, endBox.x1), y1: Math.max(startBox.y1, endBox.y1) };
  const g = grow(wide, 2.4);
  const degW = (g.x1 - g.x0) / kx;
  const step = [1, 2, 5, 10, 20, 30].find((d) => degW / d <= 16) || 30;
  const grid = svgEl("g", { stroke: K.text, "stroke-opacity": 0.1, "stroke-width": line * 0.6, fill: "none" }, world);
  for (let lon = Math.ceil((g.x0 / kx + lon0) / step) * step; (lon - lon0) * kx <= g.x1; lon += step) {
    svgEl("line", { x1: (lon - lon0) * kx, x2: (lon - lon0) * kx, y1: g.y0, y2: g.y1, "vector-effect": "non-scaling-stroke" }, grid);
  }
  for (let lat = Math.ceil((lat0 - g.y1) / step) * step; -(lat - lat0) >= g.y0; lat += step) {
    svgEl("line", { x1: g.x0, x2: g.x1, y1: -(lat - lat0), y2: -(lat - lat0), "vector-effect": "non-scaling-stroke" }, grid);
  }
}
const pathD = (f) => polysOf(f).map((poly) => poly.map((ring) => ring.map((pt, i) => { const p = proj(pt); return `${i ? "L" : "M"}${p[0].toFixed(3)} ${p[1].toFixed(3)}`; }).join("") + "Z").join("")).join("");
const level = (f) => Number(prop(f, "level")) || 0;
const land = svgEl("g", { "stroke-linejoin": "round" }, world);
const parentId = focus ? String(prop(focus, "parent") || "") : "";
// Shallow water: a wide faint band along every coast, so an island or a lone country does not float on a flat sea.
// Every country then gets an opaque base in the sea colour, which hides the band wherever it falls on land
// (so inland borders stay thin and only coasts keep it).
const countries = feats.filter((f) => level(f) === 0).map((f) => pathD(f));
countries.forEach((d) => {
  [[16, 0.035], [8, 0.05]].forEach(([w, o]) => svgEl("path", { d, fill: "none", stroke: K.text, "stroke-opacity": o, "stroke-width": line * w, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }, land));
});
countries.forEach((d) => svgEl("path", { d, "fill-rule": "evenodd", fill: K.bg }, land));
feats.filter((f) => f !== focus).sort((a, b) => level(a) - level(b)).forEach((f) => {
  const sub = level(f) > 0;
  svgEl("path", {
    d: pathD(f), "fill-rule": "evenodd", "vector-effect": "non-scaling-stroke",
    fill: sub ? "none" : K.text, "fill-opacity": parentId && String(prop(f, "id")) === parentId ? 0.17 : 0.09,
    stroke: K.text, "stroke-opacity": sub ? 0.16 : 0.34, "stroke-width": sub ? line * 0.6 : line,
  }, land);
});
let focusEls = [];
// A place that is tiny on screen or has only a few points (a simplified city) is shown as a
// region circle around the pin; its rough outline stays, but quiet.
let small = false;
if (focus) {
  const b = projBox(llBox([focus]));
  const diag = Math.hypot(b.x1 - b.x0, b.y1 - b.y0) * Math.exp(endCam.ls);
  const points = polysOf(focus).reduce((sum, poly) => sum + ((poly[0] || []).length), 0);
  small = diag < m * 0.16 || points < 10;
}
if (focus && small) {
  focusEls.push(svgEl("path", { d: pathD(focus), "fill-rule": "evenodd", "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round", fill: K.accent, "fill-opacity": 0.16, stroke: K.accent, "stroke-opacity": 0.45, "stroke-width": line }, world));
} else if (focus) {
  const d = pathD(focus);
  if (highlight === "glow") focusEls.push(svgEl("path", { d, fill: "none", stroke: K.accent, "stroke-opacity": 0.28, "stroke-width": line * 5, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }, world));
  focusEls.push(svgEl("path", {
    d, "fill-rule": "evenodd", "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round",
    fill: highlight === "outline" ? K.text : K.accent, "fill-opacity": highlight === "outline" ? 0.09 : highlight === "glow" ? 0.22 : 0.32,
    stroke: K.accent, "stroke-width": highlight === "outline" ? line * 2 : line * 1.5,
  }, world));
}

// Label point near the visual centre. properties.label (baked the same way) wins.
// A farthest-from-border search puts Vietnam's pin in the wide north.
const anchorOf = (f) => {
  const label = f.properties && f.properties.label;
  if (Array.isArray(label) && label.length >= 2 && Number.isFinite(label[0]) && Number.isFinite(label[1])) return proj(label);
  const rings = polysOf(f).map((poly) => (poly[0] || []).map(proj)).filter((r) => r.length > 2);
  const area = (r) => Math.abs(r.reduce((sum, p, i) => { const q = r[(i + 1) % r.length]; return sum + p[0] * q[1] - q[0] * p[1]; }, 0));
  const ring = rings.sort((a, b) => area(b) - area(a))[0];
  if (!ring) return [0, 0];
  const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const inside = (x, y) => {
    let hit = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const a = ring[i], b = ring[j];
      if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / ((b[1] - a[1]) || 1e-12) + a[0]) hit = !hit;
    }
    return hit;
  };
  const dist = (x, y) => {
    let best = Infinity;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const a = ring[i], b = ring[j];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy));
    }
    return best;
  };
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, span = Math.max(x1 - x0, y1 - y0) || 1;
  const pts = [];
  const N = 28;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const x = x0 + ((x1 - x0) * i) / N, y = y0 + ((y1 - y0) * j) / N;
    if (inside(x, y)) pts.push({ x, y, clear: dist(x, y) });
  }
  if (!pts.length) return [cx, cy];
  const band = pts.filter((p) => p.x >= x0 + (x1 - x0) * 0.2 && p.x <= x1 - (x1 - x0) * 0.2 && p.y >= y0 + (y1 - y0) * 0.2 && p.y <= y1 - (y1 - y0) * 0.2);
  const pool = band.length ? band : pts;
  const poolMax = pool.reduce((m, p) => Math.max(m, p.clear), 0);
  const need = poolMax * 0.45;
  let best = pool[0], score = -Infinity;
  for (const p of pool) {
    if (p.clear < need) continue;
    const next = -Math.hypot(p.x - cx, p.y - cy) / span + 0.35 * (p.clear / (poolMax || 1));

  return [best.x, best.y];
};
const toScreen = (p) => { const s = Math.exp(endCam.ls); return [endCam.ax + (p[0] - endCam.cx) * s, endCam.ay + (p[1] - endCam.cy) * s]; };

// --- pin and label (screen space, placed for the end view) ------------------
const hasPin = Boolean(focus || pinLL);
const pinAt = toScreen(pinLL ? proj(pinLL) : focus ? anchorOf(focus) : [endCam.cx, endCam.cy]);
const P = Math.round(m * 0.085); // pin height
const R = P * 0.34;
const overlay = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: "over" }, root);
overlay.style.overflow = "visible";
const pinWrap = svgEl("g", { transform: `translate(${pinAt[0].toFixed(1)} ${pinAt[1].toFixed(1)})` }, overlay);
// Range rings: they give the sea around the place something to read, and mark the area of a small place.
seaGlow.style.background = `radial-gradient(circle ${Math.round(m * 0.75)}px at ${Math.round(pinAt[0])}px ${Math.round(pinAt[1])}px, ${K.bgAlt}8C 0%, ${K.bgAlt}00 100%)`;
const halo = svgEl("g", {}, pinWrap);
const haloEls = [];
if (small) haloEls.push(svgEl("circle", { cx: 0, cy: 0, r: m * 0.085, fill: K.accent, "fill-opacity": 0.16, stroke: K.accent, "stroke-width": line * 1.5 }, halo));
[0.17, 0.29].forEach((r, i) => haloEls.push(svgEl("circle", { cx: 0, cy: 0, r: m * r, fill: "none", stroke: K.accent, "stroke-opacity": i ? 0.2 : 0.34, "stroke-width": line * 0.8, "stroke-dasharray": `${line * 2} ${line * 5}`, "stroke-linecap": "round" }, halo)));
const rings = [0, 1].map(() => svgEl("circle", { cx: 0, cy: 0, r: P * 0.9, fill: "none", stroke: K.accent, "stroke-width": line * 1.4, opacity: 0 }, pinWrap));

const pin = svgEl("g", {}, pinWrap);
svgEl("path", {
  d: `M0 0C${-R * 0.3} ${-P * 0.4} ${-R} ${-P * 0.5} ${-R} ${-(P - R)}A${R} ${R} 0 1 1 ${R} ${-(P - R)}C${R} ${-P * 0.5} ${R * 0.3} ${-P * 0.4} 0 0Z`,
  fill: K.accent, stroke: K.bgDeep, "stroke-width": line, "stroke-linejoin": "round",

svgEl("circle", { cx: 0, cy: -(P - R), r: R * 0.4, fill: K.bgDeep }, pin);
if (!hasPin) pinWrap.style.display = "none";

const base = T.sm; // neighbour and caption size
const card = el("div", "card", root);
const pad = Math.round(SP * 0.6);
const edge = Math.max(6, Math.round(m * 0.009 * L.stroke));
const nameEl = el("div", "name", card, labelText);
nameEl.style.color = K.text;
nameEl.style.lineHeight = String(T.lineHeight);
const subEl = subText ? el("div", "sub", card, subText) : null;
if (subEl) {
  subEl.style.color = K.textMuted;
  subEl.style.lineHeight = String(T.lineHeight);
}
if (floating) {
  card.style.cssText = `background:transparent;padding:${Math.round(SP * 0.25)}px ${Math.round(SP * 0.4)}px`;
} else {
  // Plate corner follows the radius token. The fill is the deep tone at 90% so the map still reads through.
  const radius = Math.round(Math.min(box.w, box.h) * 0.02 * L.radius);
  card.style.cssText = `background:${alpha(K.bgDeep, 0xE6)};border-left:${edge}px solid ${K.accent};border-radius:${radius}px;padding:${pad}px ${Math.round(pad * 1.5)}px`;

if (!labelText) card.style.display = "none";
let cardRect = null;
VG.layout(() => {
  if (!labelText) return;

  const maxW = floating ? Math.round(box.w * 0.72) : cardZone.w - pad * 3 - edge;
  const maxFs = T.xl;
  const subH = subEl ? T.sm * T.lineHeight * 1.6 : 0;

  if (fs < maxFs * 0.62) {

  nameEl.style.width = "max-content";
  nameEl.style.maxWidth = maxW + "px";

    subEl.style.maxWidth = maxW + "px";

    fitText(subEl, { maxW, maxH: subH, maxLines: 1, maxFs: Math.max(T.sm, fs * 0.5), minFs: Math.round(T.xs * 0.5), lh: T.lineHeight });

    x = Math.round(Math.max(box.x, Math.min(box.x + box.w - cw, pinAt[0] - cw / 2)));
    y = Math.round(Math.max(box.y, Math.min(box.y + box.h - ch, pinAt[1] - P - ch - Math.round(SP * 0.35))));
  } else {
    x = Math.round(cardSide === "top" && portrait ? cardZone.x + (cardZone.w - cw) / 2 : cardZone.x);
    y = Math.round(cardZone.y + (cardSide === "left" ? (cardZone.h - ch) / 2 : Math.max(0, (cardZone.h - ch) / 2)));

  card.style.left = x + "px";
  card.style.top = y + "px";
  cardRect = { x, y, w: cw, h: ch };
});

// Neighbour names, faint. Larger countries keep the label; a neighbour that overlaps one already placed is hidden.
const nbs = [];
if (v.neighbours !== false) {
  const geoArea = (f) => {
    const ring = ((polysOf(f)[0] || [])[0]) || [];
    return Math.abs(ring.reduce((sum, p, i) => { const q = ring[(i + 1) % ring.length]; return sum + p[0] * q[1] - q[0] * p[1]; }, 0));
  };
  feats.filter((f) => f !== focus && level(f) === 0 && nameOf(f)).sort((a, b) => geoArea(b) - geoArea(a)).forEach((f) => {
    const at2 = toScreen(anchorOf(f));
    const node = el("div", "nb", root, nameOf(f));
    node.style.cssText = `font-size:${Math.round(T.xs)}px;color:${K.textMuted};line-height:${T.lineHeight}`;
    nbs.push({ node, at: at2 });
  });
  VG.layout(() => {
    const placed = [];
    nbs.forEach((nb) => {
      const w = nb.node.offsetWidth, h = nb.node.offsetHeight;
      const x = nb.at[0] - w / 2, y = nb.at[1] - h / 2;
      const inView = x >= box.x && y >= box.y && x + w <= box.x + box.w && y + h <= box.y + box.h;
      const hits = (r, g) => r && x < r.x + r.w + g && x + w > r.x - g && y < r.y + r.h + g && y + h > r.y - g;
      const pinRect = hasPin ? { x: pinAt[0] - R, y: pinAt[1] - P, w: 2 * R, h: P } : null;
      const neighbour = placed.some((r) => hits(r, base * 0.35));
      const show = inView && !hits(cardRect, base * 0.4) && !hits(pinRect, base * 0.4) && !neighbour;
      nb.node.style.left = Math.round(x) + "px";
      nb.node.style.top = Math.round(y) + "px";
      nb.node.style.visibility = show ? "visible" : "hidden";
      if (show) placed.push({ x, y, w, h });
    });
  });
}

// --- motion ---------------------------------------------------------------
const zs = zoom === "static" ? 0 : M.fast * 0.6;
const zd = zoom === "static" ? END : Math.max(M.base, Math.min(M.slow * 3, END * 0.45));
tl.to(cam, { cx: endCam.cx, cy: endCam.cy, ls: endCam.ls, ax: endCam.ax, ay: endCam.ay, duration: zd, ease: zoom === "static" ? M.exit : M.move, onUpdate: apply }, at(zs, zd));
const landed = zoom === "static" ? M.fast : Math.max(0, zs + zd - M.fast * 0.6);
focusEls.forEach((node) => tl.from(node, { opacity: 0, duration: M.slow, ease: M.exit }, at(zoom === "static" ? M.fast * 0.4 : zs + zd * 0.45, M.slow)));
tl.from(seaGlow, { opacity: 0, duration: Math.max(M.base, zd), ease: M.move }, at(zs, Math.max(M.base, zd)));
if (hasPin) {
  haloEls.forEach((node, i) => tl.from(node, { scale: 0.3, opacity: 0, transformOrigin: "50% 50%", duration: M.slow, ease: M.enter }, at(landed + M.fast * 0.4 + i * M.fast * 0.4, M.slow)));
  enter(pin, landed);
  tl.from(spot, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%", duration: M.base }, at(landed + M.fast * 0.5, M.base));
  rings.forEach((ring, i) => tl.fromTo(ring, { scale: 0.15, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 1, opacity: 0, duration: M.slow * 2, ease: M.exit, immediateRender: false }, at(landed + M.base + i * M.slow, M.slow * 2)));
}
if (labelText) enter(card, landed + M.fast);
nbs.forEach((nb, i) => tl.from(nb.node, { opacity: 0, duration: M.base }, at(landed + M.fast + i * M.fast * 0.2, M.base)));
VG.finish();
