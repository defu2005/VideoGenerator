<!DOCTYPE html><html><head><meta charset="utf-8"><style>
.kt{display:flex;align-items:center;max-width:100%}
.kt-text{font-weight:var(--vg-w-display);letter-spacing:var(--vg-track-display);text-transform:var(--vg-case-display);text-wrap:balance}
.kt-line{display:block;white-space:nowrap}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block}
.rule{flex:none}
</style><script src="gsap.min.js"></script><script src="common.js"></script></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-fps="30">
<script>
// tokens-v1 (TASK-110). Colours, type, motion, spacing and shape come from VG.S.
// Axis: chrome (plain | bar | rule), plus entrance and background.
// The shot still chooses bold, typewriter or stack through shotStyle.
const VG = window.VGInit();
const { v, W, H, END, portrait, variant, box, stage, tl, at, el, fitText, M, axis, enter, fallbackStyle } = VG;
const S = fallbackStyle();
const K = S.color, T = S.type, L = S.layout, SP = S.space;
const m = Math.min(W, H);
const rawStyle = v.style && typeof v.style === "object" ? v.shotStyle : v.style;
const style = ["bold", "typewriter", "stack"].includes(rawStyle) ? rawStyle : "bold";
const maxLines = Number(v.maxLines) || (portrait ? 3 : 2);
const srcLines = (Array.isArray(v.lines) ? v.lines : []).map((line) => String(line).split(/\s+/).filter(Boolean)).filter((line) => line.length);
const flat = srcLines.flat();
const times = Array.isArray(v.words) && v.words.length === flat.length ? v.words.map((word) => Number(word.t) || 0) : flat.map((_, i) => i * M.fast);
const emphasis = new Set(v.emphasis || []);

// "stack" keeps the source lines; when there are too many, join the two shortest neighbours until they fit.
function merge(lines, count) {
  const out = lines.map((ids) => ids.slice());
  const size = (ids) => ids.reduce((sum, i) => sum + flat[i].length + 1, 0);
  while (out.length > count) {
    let best = 0;
    for (let k = 1; k < out.length - 1; k++) if (size(out[k]) + size(out[k + 1]) < size(out[best]) + size(out[best + 1])) best = k;
    out.splice(best, 2, out[best].concat(out[best + 1]));
  }
  return out;
}
let lineIdx = [];
let cursor = 0;
srcLines.forEach((line) => { lineIdx.push(line.map(() => cursor++)); });
if (style === "stack" && lineIdx.length > maxLines) lineIdx = merge(lineIdx, maxLines);

// Without a picked axis, variant 0/1/2 stays plain, bar, rule — the old three frames.
const chrome = axis("chrome", ["plain", "bar", "rule"], v.style && v.style.axes ? undefined : ["plain", "bar", "rule"][variant]);
const left = chrome === "bar";
stage.style.alignItems = "center";
stage.style.justifyContent = left ? "flex-start" : "center";
const wrap = el("div", "kt", stage);
wrap.style.flexDirection = left ? "row" : "column";
// Bar thickness is 1.2% of the short side, scaled by the stroke token.
const ruleSize = Math.max(6, Math.round(m * 0.012 * L.stroke));
const gap = Math.round(SP * 0.75);
wrap.style.gap = gap + "px";
const strokePx = (share, min) => Math.max(min, Math.round(m * share * L.stroke));
let rule = null;
const paintRule = (node, wide) => {
  // Pill when the radius token is 1, a square end when it is 0.
  const radius = Math.round(ruleSize * 0.5 * L.radius);
  // The underline is 16% of the short side; the side bar stretches with the words.
  node.style.cssText = wide
    ? `height:${ruleSize}px;width:${Math.round(m * 0.16)}px;border-radius:${radius}px;background:${K.accent};transform-origin:50% 50%`
    : `width:${ruleSize}px;align-self:stretch;border-radius:${radius}px;background:${K.accent};transform-origin:50% 50%`;
};
if (left) {
  rule = el("div", "rule", wrap);
  paintRule(rule, false);
}
const text = el("div", "kt-text", wrap);
text.style.textAlign = left ? "left" : "center";
text.style.color = K.text;
text.style.lineHeight = String(T.lineHeight);
if (chrome === "rule") {
  rule = el("div", "rule", wrap);
  paintRule(rule, true);
}

const wordEls = [];
const lineEls = [];
const makeWord = (i, parent) => {
  const node = el("span", "w", parent);
  if (emphasis.has(i)) node.style.color = K.accent;
  if (style === "typewriter") Array.from(flat[i]).forEach((ch) => el("span", "ch", node, ch));
  else node.textContent = flat[i];
  wordEls[i] = node;
};
if (style === "stack") {
  lineIdx.forEach((ids) => {
    const line = el("div", "kt-line", text);
    line.style.lineHeight = String(T.lineHeight);
    ids.forEach((i, n) => { if (n) line.appendChild(document.createTextNode(" ")); makeWord(i, line); });
    lineEls.push(line);
  });
} else {
  flat.forEach((_, i) => { if (i) text.appendChild(document.createTextNode(" ")); makeWord(i, text); });
}

// Fit inside the safe box. The side bar takes a column; the underline keeps a band under the words.
const sideW = left ? ruleSize + gap : 0;
const maxW = (box.w - sideW) * 0.96;
const maxH = box.h * (chrome === "rule" ? 0.86 : 0.94);
const cap = T.xxl;
VG.layout(() => {
  if (!flat.length) return;
  if (style === "stack") {
    text.style.width = "";
    lineEls.forEach((line) => { line.style.fontSize = ""; });
    // Measure each line's width per pixel, then scale. Not a design size.
    text.style.fontSize = "100px";
    const widths = lineEls.map((line) => line.scrollWidth / 100);
    const widest = Math.max(...widths);
    let baseFs = Math.min(cap, maxW / widest);
    // A short line may grow to 1.5× the base, and no line past 1.2× the type cap.
    const sizes = () => widths.map((w) => Math.min(baseFs * 1.5, maxW / w, cap * 1.2));
    const height = () => sizes().reduce((sum, fs) => sum + fs * T.lineHeight, 0);
    if (height() > maxH) baseFs *= maxH / height();
    const final = sizes();
    const shrink = Math.min(1, maxH / final.reduce((sum, fs) => sum + fs * T.lineHeight, 0));
    lineEls.forEach((line, i) => { line.style.fontSize = Math.floor(final[i] * shrink) + "px"; });
  } else {
    text.style.width = Math.floor(maxW) + "px";
    fitText(text, { maxW, maxH, maxLines, maxFs: cap, minFs: Math.round(T.xs * 0.5), lh: T.lineHeight });
    // Shrink-wrap so the side bar sits next to the words. offsetLeft ignores entrance transforms.
    const lefts = wordEls.map((node) => node.offsetLeft);
    const rights = wordEls.map((node) => node.offsetLeft + node.offsetWidth);
    text.style.width = Math.min(Math.floor(maxW), Math.ceil(Math.max(...rights) - Math.min(...lefts)) + 2) + "px";
  }
});

// The rule draws on its own. Words, letters and stacked lines use the entrance axis.
if (rule) tl.from(rule, { scaleX: left ? 1 : 0, scaleY: left ? 0 : 1, duration: M.slow, ease: M.enter }, at(left ? 0 : M.fast * 0.5, M.slow));
if (style === "typewriter") {
  // Caret is a thin accent bar, 0.6% of the short side. A letter is a short slice of the fast beat.
  const caret = `${strokePx(0.006, 3)}px 0 0 0 ${K.accent}`;
  const tick = M.fast * 0.08;
  const chars = [];
  wordEls.forEach((node, i) => {
    const list = Array.from(node.children);
    const start = at(times[i], tick);
    const next = i + 1 < flat.length ? Math.max(start, at(times[i + 1], tick)) : END;
    // Letters share the gap until the next word, and never take longer than a short beat.
    const step = Math.min(M.fast * 0.18, Math.max(0.001, (next - start) / Math.max(1, list.length)));
    list.forEach((ch, j) => chars.push({ ch, t: start + j * step }));
  });
  chars.forEach((item, n) => {
    enter(item.ch, item.t, { duration: tick });
    tl.set(item.ch, { boxShadow: caret }, at(item.t, tick));
    if (n + 1 < chars.length) tl.set(item.ch, { boxShadow: "none" }, at(chars[n + 1].t, tick));
  });
} else if (style === "stack") {
  lineEls.forEach((line, n) => enter(line, times[lineIdx[n][0]]));
  wordEls.forEach((node, i) => {
    // Emphasis pops 12% past the resting size after the line has arrived.
    if (emphasis.has(i)) tl.fromTo(node, { scale: 1 }, { scale: 1.12, duration: M.fast, ease: M.emphasis, yoyo: true, repeat: 1 }, at(times[i] + M.fast * 0.35, M.fast));
  });
} else {
  wordEls.forEach((node, i) => {
    enter(node, times[i]);
    if (emphasis.has(i)) tl.fromTo(node, { scale: 1 }, { scale: 1.12, duration: M.fast, ease: M.emphasis, yoyo: true, repeat: 1 }, at(times[i] + M.base, M.fast));
  });
}
VG.finish();
</script></div></body></html>
