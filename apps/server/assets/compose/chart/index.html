<!DOCTYPE html><html><head><meta charset="utf-8"><style>
#stage{flex-direction:column}
.title{font-weight:var(--vg-w-display);letter-spacing:var(--vg-track-display);text-transform:var(--vg-case-display);flex:none;display:flex;align-items:center}
.zone{position:relative;flex:none}
.cols{display:flex;align-items:flex-end;justify-content:center;height:100%}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.val{font-weight:var(--vg-w-display);letter-spacing:var(--vg-track-display);white-space:nowrap;font-variant-numeric:tabular-nums}
.lab,.leg{font-weight:var(--vg-w-body)}
.lab{text-align:center;display:flex;align-items:flex-start;justify-content:center;width:100%}
.rows{display:flex;flex-direction:column;justify-content:center;height:100%}
.row{display:flex;flex-direction:column;justify-content:center}
.track{display:flex;align-items:center}
.pin{position:absolute;white-space:nowrap;text-align:center}
.legend{display:flex;flex-direction:column;justify-content:center}
.leg{display:flex;align-items:center;white-space:nowrap}
.center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style><script src="gsap.min.js"></script><script src="common.js"></script></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-fps="30">
<script>
// tokens-v1 (TASK-110). Colours, type, motion, spacing and shape come from VG.S.
// Axis: frame (bleed | card), plus entrance and background. The chart type stays on the shot.
const VG = window.VGInit();
const { v, W, H, END, portrait, box, stage, tl, at, el, fitText, M, axis, enter, fallbackStyle } = VG;
const S = fallbackStyle();
const K = S.color, T = S.type, L = S.layout, SP = S.space;
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => {
  const node = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
  if (parent) parent.appendChild(node);
  return node;
};
const type = ["bar", "line", "pie"].includes(v.chart) ? v.chart : "bar";
const values = (Array.isArray(v.values) ? v.values : []).map(Number).map((n) => (Number.isFinite(n) ? n : 0));
const labels = values.map((_, i) => String((v.labels || [])[i] ?? ""));
const n = values.length;
const unit = String(v.unit || "").trim();
const decimals = values.every((x) => Number.isInteger(x)) ? 0 : 1;
let nf;
try { nf = new Intl.NumberFormat(v.language || "vi", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
catch { nf = new Intl.NumberFormat("en", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }
const suffix = unit ? (/^[%‰°]/.test(unit) ? unit : " " + unit) : "";
const fmt = (x) => nf.format(decimals ? x : Math.round(x)) + suffix;
const muted = K.textMuted;
const palette = K.series && K.series.length ? K.series : [K.accent, K.text, muted];

const m = Math.min(W, H);
const base = T.sm; // labels
const valFs = T.md; // values
const span = Math.min(END, M.slow * 4); // data budget: four slow beats

// Title: fixed band at the top of the safe box, so the plot size never depends on font loading.
const titleText = String(v.title || "").trim();
// Card sits one step inside the safe box. Bleed uses the whole box. No axis yet: bleed, as before.
const frameId = axis("frame", ["bleed", "card"], v.style && v.style.axes ? undefined : "bleed");
const card = frameId === "card";
const inset = card ? Math.round(SP * 1.1) : 0;
if (card) {
  const panel = el("div", "", stage);
  // Corner is 4.5% of the short side when the radius token is 1.
  const radius = Math.round(m * 0.045 * L.radius);
  panel.style.cssText = `position:absolute;z-index:0;left:${inset}px;top:${inset}px;width:${box.w - inset * 2}px;height:${box.h - inset * 2}px;border-radius:${radius}px;background:${K.bgAlt}`;
}
stage.style.boxSizing = "border-box";
stage.style.padding = inset + "px";
const innerW = box.w - inset * 2;
const innerH = box.h - inset * 2;
const titleH = titleText ? Math.round(innerH * (portrait ? 0.16 : 0.19)) : 0;
const gapH = titleText ? Math.round(innerH * 0.04) : 0;
if (titleText) {
  const title = el("div", "title", stage);
  title.style.height = titleH + "px";
  // The card is positioned, so the title and plot need their own layer or a fade entrance sits under it.
  title.style.position = "relative";
  title.style.zIndex = "1";
  const centered = L.align === "center";
  title.style.justifyContent = centered ? "center" : "flex-start";
  title.style.gap = Math.round(SP * 0.55) + "px";
  let mark = null;
  if (!centered) {
    mark = el("div", "", title);
    const bar = Math.max(6, Math.round(m * 0.011 * L.stroke));
    mark.style.cssText = `flex:none;width:${bar}px;height:62%;border-radius:${Math.round(bar * 0.5 * L.radius)}px;background:${K.accent}`;
  }
  const label = el("div", "", title, titleText);
  label.style.color = K.text;
  label.style.textAlign = centered ? "center" : "left";
  label.style.lineHeight = String(T.lineHeight);
  const maxW = innerW - (mark ? m * 0.011 * L.stroke + SP * 0.55 + 2 : 0);
  label.style.width = Math.floor(maxW) + "px";
  VG.layout(() => {
    label.style.width = Math.floor(maxW) + "px";
    fitText(label, { maxW, maxH: titleH, maxLines: 2, maxFs: T.xl, minFs: Math.round(T.xs * 0.5), lh: T.lineHeight });
    if (!centered) label.style.width = "auto";
  });
  enter(label, 0);
  if (mark) enter(mark, 0);
}
stage.style.gap = gapH + "px";
const zoneW = innerW;
const zoneH = innerH - titleH - gapH;
const zone = el("div", "zone", stage);
zone.style.cssText = `position:relative;z-index:1;width:${zoneW}px;height:${zoneH}px`;

const countUp = (node, value, start, dur) => {
  const state = { x: 0 };
  node.textContent = fmt(0);
  tl.to(state, { x: value, duration: dur, ease: M.move, onUpdate: () => { node.textContent = fmt(state.x); } }, start);
};
const fitLabel = (node, maxW, maxH, lines) => VG.layout(() => fitText(node, { maxW, maxH, maxLines: lines, maxFs: base, minFs: Math.round(T.xs * 0.5), lh: T.lineHeight }));
const maxAbs = Math.max(1e-9, ...values.map(Math.abs));
const peak = values.indexOf(Math.max(...values));
const barColor = (i) => (i === peak ? K.accent : muted);
const dur = Math.max(M.fast, span * 0.45);
const stagger = n > 1 ? (span * 0.5) / (n - 1) : 0;

if (n === 0) {
  // nothing to draw: the title alone stays on screen
} else if (type === "bar" && !portrait && n <= 8) {
  // Columns that grow from the baseline; the value rides on top of its column.
  const cols = el("div", "cols", zone);
  const gap = Math.round(zoneW * 0.035);
  const colW = Math.floor(Math.min((zoneW - gap * (n - 1)) / n, zoneW * 0.2));
  cols.style.gap = gap + "px";
  const labH = Math.round(base * T.lineHeight * 2);
  const valH = Math.round(valFs * T.lineHeight * 1.15);
  const plotH = zoneH - labH - valH - Math.round(base * 0.4);
  values.forEach((value, i) => {
    const col = el("div", "col", cols);
    col.style.width = colW + "px";
    const val = el("div", "val", col);
    val.style.cssText = `font-size:${valFs}px;height:${valH}px;color:${i === peak ? K.accent : K.text}`;
    const bar = el("div", "", col);
    const h = Math.max(4, Math.round((Math.abs(value) / maxAbs) * plotH));
    // Top corner is half the column when the radius token is 1.
    const topR = Math.round(colW * 0.5 * L.radius);
    bar.style.cssText = `flex:none;width:${Math.round(colW * 0.78)}px;height:${h}px;border-radius:${topR}px ${topR}px 0 0;background:${barColor(i)}`;
    const lab = el("div", "lab", col);
    lab.style.cssText = `height:${labH}px;margin-top:${Math.round(base * 0.4)}px`;
    const text = el("span", "", lab, labels[i]);
    text.style.cssText = `display:block;width:${colW}px`;
    fitLabel(text, colW, labH, 2);
    const start = at(M.fast * 0.4 + i * stagger, dur);
    tl.from(bar, { height: 0, duration: dur, ease: M.enter }, start);
    tl.from(val, { opacity: 0, duration: M.fast }, start);
    tl.from(lab, { opacity: 0, duration: M.fast }, at(M.fast * 0.2 + i * stagger, M.fast));
    countUp(val, value, start, dur);
  });
} else if (type === "bar") {
  // Rows for 9:16 and long lists: label on top, bar under it, value at the bar end.
  const rows = el("div", "rows", zone);
  const rowH = Math.floor(Math.min(zoneH / n, zoneH * 0.24));
  const fs = Math.min(base, Math.floor(rowH * 0.3));
  const vfs = Math.round(fs * 1.25);
  const barH = Math.max(6, Math.round(rowH * 0.3));
  const valW = Math.round(vfs * 0.62 * (fmt(maxAbs).length + 1));
  const trackW = zoneW - valW;
  values.forEach((value, i) => {
    const row = el("div", "row", rows);
    row.style.height = rowH + "px";
    const lab = el("div", "", row, labels[i]);
    lab.style.cssText = `white-space:nowrap;width:${zoneW}px;height:${Math.round(fs * T.lineHeight)}px`;
    VG.layout(() => fitText(lab, { maxW: zoneW, maxH: fs * T.lineHeight + 2, maxLines: 1, maxFs: fs, minFs: Math.round(fs * 0.55) }));
    const track = el("div", "track", row);
    track.style.cssText = `height:${Math.round(vfs * T.lineHeight)}px;gap:${Math.round(fs * 0.4)}px`;
    const bar = el("div", "", track);
    const w = Math.max(4, Math.round((Math.abs(value) / maxAbs) * (trackW - fs * 0.4)));
    // End cap is a semicircle when the radius token is 1.
    const endR = Math.round(barH * 0.5 * L.radius);
    bar.style.cssText = `flex:none;height:${barH}px;width:${w}px;border-radius:0 ${endR}px ${endR}px 0;background:${barColor(i)}`;
    const val = el("div", "val", track);
    val.style.cssText = `font-size:${vfs}px;color:${i === peak ? K.accent : K.text}`;
    const start = at(M.fast * 0.4 + i * stagger, dur);
    tl.from(bar, { width: 0, duration: dur, ease: M.enter }, start);
    tl.from(lab, { opacity: 0, x: -fs, duration: M.fast }, at(M.fast * 0.2 + i * stagger, M.fast));
    tl.from(val, { opacity: 0, duration: M.fast }, start);
    countUp(val, value, start, dur);
  });
} else if (type === "line") {
  const padX = Math.round(zoneW * (portrait ? 0.1 : 0.07));
  const padTop = Math.round(valFs * T.lineHeight * 1.6);
  const labH = Math.round(base * T.lineHeight * (portrait ? 2 : 1.3));
  const plotH = zoneH - padTop - labH - Math.round(base * 0.6);
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const range = hi - lo;
  const floor = range === 0 ? lo - 1 : lo - range * 0.3;
  const top = range === 0 ? hi + 1 : hi;
  const pts = values.map((value, i) => ({
    x: n === 1 ? zoneW / 2 : padX + (i * (zoneW - 2 * padX)) / (n - 1),
    y: padTop + plotH - ((value - floor) / (top - floor)) * plotH,
  }));
  const svg = svgEl("svg", { width: zoneW, height: zoneH, viewBox: `0 0 ${zoneW} ${zoneH}` }, zone);
  svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
  // A word unit ("triệu") is written once above the plot; the pins carry the numbers only.
  const wordUnit = unit.length > 1;
  const pinText = (x) => (wordUnit ? nf.format(x) : fmt(x));
  if (wordUnit) {
    const note = el("div", "", zone, unit);
    note.style.cssText = `position:absolute;${values[0] > values[n - 1] ? "right" : "left"}:0;top:0;font-size:${Math.round(base * 0.85)}px;opacity:0.7;white-space:nowrap`;
    tl.from(note, { opacity: 0, duration: M.fast }, at(M.fast * 0.4, M.fast));
  }
  // Keep a centred label inside the plot, whatever the font measures.
  const centre = (node, x, width) => VG.layout(() => {
    const w = width || node.offsetWidth;
    node.style.left = Math.round(Math.max(0, Math.min(zoneW - w, x - w / 2))) + "px";
  });
  for (let g = 0; g <= 3; g++) {
    const y = padTop + (plotH * g) / 3;
    svgEl("line", { x1: 0, x2: zoneW, y1: y, y2: y, stroke: K.text, "stroke-opacity": g === 3 ? 0.35 : 0.1, "stroke-width": 2 }, svg);
  }
  const defs = svgEl("defs", {}, svg);
  const grad = svgEl("linearGradient", { id: "fill", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  svgEl("stop", { offset: "0%", "stop-color": K.accent, "stop-opacity": 0.32 }, grad);
  svgEl("stop", { offset: "100%", "stop-color": K.accent, "stop-opacity": 0 }, grad);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const area = svgEl("path", { d: `${d} L${pts[n - 1].x.toFixed(1)} ${padTop + plotH} L${pts[0].x.toFixed(1)} ${padTop + plotH} Z`, fill: "url(#fill)" }, svg);
  let total = 0;
  const cum = pts.map((p, i) => (i ? (total += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y)) : 0));
  const stroke = Math.max(4, Math.round(m * 0.007));
  const path = svgEl("path", { d, fill: "none", stroke: K.accent, "stroke-width": stroke, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
  const drawDur = Math.min(M.slow * 2, Math.max(M.fast, END * 0.6)); // the line draws across two slow beats
  const t0 = at(0.15, drawDur);
  if (total > 0) {
    path.setAttribute("stroke-dasharray", `${total.toFixed(1)} ${total.toFixed(1)}`);
    tl.fromTo(path, { attr: { "stroke-dashoffset": total } }, { attr: { "stroke-dashoffset": 0 }, duration: drawDur, ease: M.move }, t0);
  }
  tl.from(area, { opacity: 0, duration: M.base }, at(t0 + drawDur * 0.7, M.base));
  // Too many points: label only the ends and the extremes.
  const show = new Set(n <= 6 ? values.map((_, i) => i) : [0, n - 1, values.indexOf(hi), values.indexOf(lo)]);
  const stepW = n > 1 ? (zoneW - 2 * padX) / (n - 1) : zoneW;
  const longest = Math.max(...values.map((x) => pinText(x).length));
  const pinFs = Math.round(Math.min(valFs, n <= 6 ? (stepW * 0.92) / (longest * 0.62) : valFs));
  const r = Math.round(stroke * 1.5);
  pts.forEach((p, i) => {
    // The move ease is fastest through the middle, so a share s of the path lands near this time.
    const s = total > 0 ? cum[i] / total : 0;
    const when = t0 + drawDur * (s < 0.5 ? Math.sqrt(s / 2) : 1 - Math.sqrt((1 - s) / 2));
    const dot = svgEl("circle", { cx: p.x, cy: p.y, r, fill: K.bg, stroke: K.accent, "stroke-width": Math.max(3, stroke * 0.7) }, svg);
    tl.from(dot, { scale: 0, svgOrigin: `${p.x} ${p.y}`, duration: M.base, ease: M.emphasis }, at(when, M.base));
    if (!show.has(i)) return;
    const pin = el("div", "pin val", zone);
    pin.style.cssText = `top:${Math.round(p.y - r - pinFs * T.lineHeight * 1.2)}px;font-size:${pinFs}px;color:${values[i] === hi ? K.accent : K.text}`;
    const inner = el("span", "", pin, pinText(values[i]));
    inner.style.display = "inline-block";
    centre(pin, p.x);
    tl.from(inner, { opacity: 0, y: valFs * 0.4, duration: M.fast, ease: M.move }, at(when + M.fast * 0.2, M.fast));
    const tag = el("div", "pin", zone);
    const tagW = Math.floor(Math.min(n <= 6 ? stepW * 0.92 : stepW * 2, padX * 2 + (n > 2 ? stepW * 0.4 : 0)));
    centre(tag, p.x, tagW);
    tag.style.cssText += `;top:${padTop + plotH + Math.round(base * 0.6)}px;width:${tagW}px;white-space:normal;height:${labH}px`;
    const tagText = el("span", "", tag, labels[i]);
    tagText.style.cssText = `display:block;width:${tagW}px;opacity:0.85`;
    fitLabel(tagText, tagW, labH, portrait ? 2 : 1);
    tl.from(tag, { opacity: 0, duration: M.fast }, at(when, M.fast));
  });
} else {
  // Donut: one progress value sweeps every segment in turn.
  const sum = values.reduce((acc, x) => acc + Math.abs(x), 0) || 1;
  const size = Math.floor(portrait ? Math.min(zoneW * 0.78, zoneH * 0.52) : Math.min(zoneH, zoneW * 0.42));
  const pad = Math.round(m * 0.04);
  zone.style.display = "flex";
  zone.style.flexDirection = portrait ? "column" : "row";
  zone.style.alignItems = "center";
  zone.style.justifyContent = "center";
  zone.style.gap = pad + "px";
  const holder = el("div", "", zone);
  holder.style.cssText = `position:relative;flex:none;width:${size}px;height:${size}px`;
  const svg = svgEl("svg", { width: size, height: size, viewBox: `0 0 ${size} ${size}` }, holder);
  const sw = size * 0.17;
  const r = size / 2 - sw / 2 - 2;
  const circ = 2 * Math.PI * r;
  svgEl("circle", { cx: size / 2, cy: size / 2, r, fill: "none", stroke: K.text, "stroke-opacity": 0.08, "stroke-width": sw }, svg);
  const gapLen = n > 1 ? circ * 0.006 : 0;
  let acc = 0;
  const segs = values.map((value, i) => {
    const len = (Math.abs(value) / sum) * circ;
    const node = svgEl("circle", {
      cx: size / 2, cy: size / 2, r, fill: "none", stroke: palette[i % palette.length], "stroke-width": sw,
      "stroke-dasharray": `0 ${circ}`, "stroke-dashoffset": -acc, transform: `rotate(-90 ${size / 2} ${size / 2})`,
    }, svg);
    const seg = { node, start: acc, len };
    acc += len;
    return seg;
  });
  const sweep = { p: 0 };
  const sweepDur = Math.min(M.slow * 2, Math.max(M.fast, END * 0.6));
  const draw = () => segs.forEach((seg) => {
    const shown = Math.max(0, Math.min(seg.len, sweep.p * circ - seg.start) - gapLen);
    seg.node.setAttribute("stroke-dasharray", `${shown.toFixed(2)} ${(circ - shown).toFixed(2)}`);
  });
  tl.to(sweep, { p: 1, duration: sweepDur, ease: M.move, onUpdate: draw }, at(M.fast * 0.4, sweepDur));
  // Centre: the largest share, counted up.
  const share = (i) => (unit === "%" ? values[i] : (Math.abs(values[i]) / sum) * 100);
  const pct = (x) => nf.format(decimals ? x : Math.round(x)) + "%";
  const inner = Math.floor((r - sw / 2) * 2 * 0.74);
  const center = el("div", "center", holder);
  center.style.cssText = `left:${(size - inner) / 2}px;top:${(size - inner) / 2}px;width:${inner}px;height:${inner}px`;
  const big = el("div", "val", center);
  big.style.cssText = `font-size:${Math.round(inner * 0.3)}px;color:${palette[peak % palette.length]}`;
  const bigState = { x: 0 };
  big.textContent = pct(0);
  tl.to(bigState, { x: share(peak), duration: sweepDur, ease: M.move, onUpdate: () => { big.textContent = pct(bigState.x); } }, at(M.fast * 0.4, sweepDur));
  const small = el("div", "", center, labels[peak]);
  small.style.cssText = `width:${inner}px;opacity:0.85`;
  VG.layout(() => fitText(small, { maxW: inner, maxH: inner * 0.34, maxLines: 2, maxFs: base * 0.9, minFs: Math.round(T.xs * 0.5), lh: T.lineHeight }));
  tl.from(center, { opacity: 0, scale: 0.9, duration: M.base, ease: M.enter }, at(M.fast * 0.4, M.base));
  // Legend.
  const legW = portrait ? zoneW : zoneW - size - pad;
  const legH = portrait ? zoneH - size - pad : zoneH;
  const legend = el("div", "legend", zone);
  legend.style.cssText = `flex:none;max-width:${legW}px;max-height:${legH}px;gap:0.35em`;
  values.forEach((value, i) => {
    const row = el("div", "leg", legend);
    row.style.gap = "0.5em";
    const dot = el("span", "", row);
    dot.style.cssText = `flex:none;width:0.7em;height:0.7em;border-radius:0.18em;background:${palette[i % palette.length]}`;
    el("span", "", row, labels[i]).style.opacity = "0.9";
    const num = el("span", "val", row, unit === "%" || !unit ? pct(share(i)) : fmt(value));
    num.style.marginLeft = "0.2em";
    tl.from(row, { opacity: 0, x: base * 0.6, duration: M.fast, ease: M.move }, at(M.fast * 0.8 + (segs[i].start / circ) * sweepDur, M.fast));
  });
  VG.layout(() => {
    legend.style.width = "max-content";
    const maxFs = Math.min(base * 1.1, (legH / Math.max(1, n)) / (T.lineHeight * 1.35));
    fitText(legend, { maxW: legW, maxH: legH, maxFs, minFs: Math.round(T.xs * 0.5), lh: T.lineHeight });
  });
}
VG.finish();
</script></div></body></html>
