<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Be Vietnam Pro";src:url("font.woff2") format("woff2");font-weight:400}@font-face{font-family:"Be Vietnam Pro";src:url("font-bold.woff2") format("woff2");font-weight:700}html,body{margin:0;background:transparent;color:#fff;font-family:"Be Vietnam Pro",sans-serif}
#root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%}

.col{width:48px}</style><script src="gsap.min.js"></script></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30" data-composition-variables='{"text":{"type":"string","default":"","maxLength":24},"color":{"type":"color","default":"#F5C518"}}'><div id="word"></div><div id="bar"></div><script>const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
const el = document.getElementById("word");
el.textContent = v.text || "";
el.style.color = v.color || "#F5C518";
const tl = gsap.timeline({ paused: true });
tl.from("#word", { scale: 0.85, filter: "blur(8px)", opacity: 0, duration: 0.35 }, 0);
tl.from("#bar", { scaleX: 0, duration: 0.4 }, 0.15);
window.__timelines = { main: tl };</script></div></body></html>
