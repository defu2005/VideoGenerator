<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Be Vietnam Pro";src:url("font.woff2") format("woff2");font-weight:400}@font-face{font-family:"Be Vietnam Pro";src:url("font-bold.woff2") format("woff2");font-weight:700}html,body{margin:0;background:transparent;color:#fff;font-family:"Be Vietnam Pro",sans-serif}
#root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%}
h1,h2,p,blockquote{margin:0;max-width:90%}
#bar{height:8px;width:40%}
#fill{height:10px;width:100%}
#chart{display:flex;align-items:flex-end;gap:12px;height:220px}
.col{width:48px}</style><script src="gsap.min.js"></script></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30" data-composition-variables='{"name":{"type":"string","default":"","maxLength":32},"sub":{"type":"string","default":"","maxLength":40},"color":{"type":"color","default":"#38BDF8"}}'><div id="bar"></div><strong id="name"></strong><p id="sub"></p><script>const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
document.getElementById("name").textContent = v.name || "";
document.getElementById("sub").textContent = v.sub || "";
document.getElementById("bar").style.background = v.color || "#38BDF8";
const tl = gsap.timeline({ paused: true });
tl.from("#bar", { x: -80, opacity: 0, duration: 0.35 }, 0);
tl.from("#name", { x: -20, opacity: 0, duration: 0.3 }, 0.15);
window.__timelines = { main: tl };</script></div></body></html>
