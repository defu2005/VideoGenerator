<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Be Vietnam Pro";src:url("font.woff2") format("woff2");font-weight:400}@font-face{font-family:"Be Vietnam Pro";src:url("font-bold.woff2") format("woff2");font-weight:700}html,body{margin:0;background:transparent;color:#fff;font-family:"Be Vietnam Pro",sans-serif}
#root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%}

#bar{height:8px;width:40%}

.col{width:48px}</style><script src="gsap.min.js"></script></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30" data-composition-variables='{"badge":{"type":"string","default":"#1","maxLength":8},"title":{"type":"string","default":"","maxLength":40},"color":{"type":"color","default":"#F8FAFC"}}'><span id="badge"></span><span id="title"></span><script>const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
document.getElementById("badge").textContent = v.badge || "#1";
document.getElementById("title").textContent = v.title || "";
document.getElementById("title").style.color = v.color || "#F8FAFC";
const tl = gsap.timeline({ paused: true });
tl.from("#badge", { scale: 0.6, opacity: 0, duration: 0.3 }, 0);
tl.from("#title", { y: 16, opacity: 0, duration: 0.35 }, 0.12);
window.__timelines = { main: tl };</script></div></body></html>
