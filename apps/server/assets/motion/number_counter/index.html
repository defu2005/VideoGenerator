<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Be Vietnam Pro";src:url("font.woff2") format("woff2");font-weight:400}@font-face{font-family:"Be Vietnam Pro";src:url("font-bold.woff2") format("woff2");font-weight:700}html,body{margin:0;background:transparent;color:#fff;font-family:"Be Vietnam Pro",sans-serif}
#root{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%}

#bar{height:8px;width:40%}

.col{width:48px}</style><script src="gsap.min.js"></script></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30" data-composition-variables='{"value":{"type":"number","default":0},"prefix":{"type":"string","default":"","maxLength":8},"suffix":{"type":"string","default":"","maxLength":8},"label":{"type":"string","default":"","maxLength":32},"color":{"type":"color","default":"#F8FAFC"}}'><div id="num"></div><p id="label"></p><script>const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
const state = { n: 0 };
const el = document.getElementById("num");
el.style.color = v.color || "#F8FAFC";
document.getElementById("label").textContent = v.label || "";
const tl = gsap.timeline({ paused: true });
tl.to(state, { n: Number(v.value) || 0, duration: 1.4, onUpdate() { el.textContent = (v.prefix || "") + Math.round(state.n) + (v.suffix || ""); } }, 0);
window.__timelines = { main: tl };</script></div></body></html>
